# Use postgres/example user/password credentials

services:
  db:
    image: postgres:16
    restart: no
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: ghcr.io/shyim/adminerevo:latest
    restart: no
    ports:
      - 8080:8080

  # Dev-only SMTP sink + web UI/API: SMTP :1025, UI/API http://localhost:8025.
  # The newsletter sender defaults to it (see SMTP_* in .env.example).
  mailpit:
    image: axllent/mailpit:latest
    restart: no
    ports:
      - "1025:1025"
      - "8025:8025"

  # Production image (web server + /gems CLI). Opt-in so plain
  # `docker compose up -d` for development only starts db/adminer/mailpit:
  #   docker compose --profile prod up -d app
  # Cron/one-off jobs run against the same image, e.g.:
  #   docker compose run --rm app /gems refresh
  app:
    build: .
    image: indie-game-gems:latest
    profiles: [prod]
    restart: no
    env_file: .env
    environment:
      # Inside the compose network the DB is the `db` service; the password
      # comes from POSTGRES_PASSWORD (same default as the db service).
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-password}@db:5432/postgres?sslmode=disable
      MEDIA_DIR: /data/media
      PORT: "3000"
      APP_ENV: production
    ports:
      # Change APP_PORT if 3000 is taken on the host (same pattern as POSTGRES_PORT).
      - "${APP_PORT:-3000}:3000"
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  media_data:
